<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04070d" />
  <meta name="color-scheme" content="dark" />
  <title>赛博魔法 · 星尘粒子场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%2304070d'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='2.6'%20fill='%23fff'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='9'%20fill='none'%20stroke='%2364e0e8'%20stroke-width='1.4'%20stroke-dasharray='5%204'/%3E%3Ccircle%20cx='24.5'%20cy='9.5'%20r='1.4'%20fill='%236e92ff'/%3E%3Ccircle%20cx='7.5'%20cy='22'%20r='1.4'%20fill='%23b084ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 游戏画布：只有进入粒子场后才渲染，主菜单里完全隐藏 -->
  <canvas id="board" class="board" aria-label="星尘粒子场"></canvas>

  <!-- 摄像头只用于本机手部识别，绝不显示画面 -->
  <video id="camera" playsinline muted autoplay aria-hidden="true"></video>

  <!-- 主界面：干净的科技感菜单，不含粒子洪流 -->
  <section id="gate" class="gate" aria-labelledby="gate-title">
    <div class="gate-grid" aria-hidden="true"></div>
    <div class="gate-glow glow-a" aria-hidden="true"></div>
    <div class="gate-glow glow-b" aria-hidden="true"></div>
    <div class="gate-frame" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <div class="gate-hud" aria-hidden="true">
      <span class="hud hud-tl">SYS / STARDUST-01</span>
      <span class="hud hud-tr">CAMERA · LOCAL ONLY</span>
      <span class="hud hud-bl">21 PT GESTURE TRACKING</span>
      <span class="hud hud-br">ESC · EXIT TO MENU</span>
    </div>

    <div class="gate-inner">
      <div class="orbit" aria-hidden="true">
        <span class="orbit-halo"></span>
        <span class="orbit-ring ring-a"></span>
        <span class="orbit-ring ring-b"></span>
        <span class="orbit-ring ring-c"></span>
        <span class="orbit-core"></span>
      </div>

      <p class="eyebrow">GESTURE · PARTICLE FIELD</p>
      <h1 id="gate-title">赛博魔法</h1>
      <p class="tagline">星尘粒子场</p>

      <div class="rule" aria-hidden="true"><span></span></div>

      <p class="intro">
        指尖推开星尘，捏合让万点聚拢。<br />
        它们永远在挣扎，想要挣脱。
      </p>

      <div class="actions">
        <button id="start" class="btn primary" type="button">进入粒子场</button>
      </div>

      <p class="menu-keys"><kbd>ESC</kbd> 退出全屏并返回主界面</p>
      <p id="gate-status" class="status" role="status" aria-live="polite"></p>
      <p class="footnote">摄像头画面仅在本机识别 · 不显示 · 不上传</p>
    </div>
  </section>

  <!-- 调试用摄像头预览：仅 ?preview=1 打开 -->
  <div id="preview" class="preview" hidden aria-hidden="true">
    <canvas id="preview-canvas"></canvas>
    <div class="preview-bar">
      <span id="preview-status">摄像头预览</span>
    </div>
  </div>

  <noscript><p class="noscript">这个粒子场需要启用 JavaScript。</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
